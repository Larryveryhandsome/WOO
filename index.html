<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#0f0f17">
    <title>迷因左右滑 · Hornydragon Meme Swipe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <button id="btn-menu" class="icon-btn" aria-label="選單">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
        </button>
        <div class="brand">
            <span class="logo">🐉</span>
            <span class="brand-text">memes</span>
        </div>
        <button id="btn-liked" class="icon-btn liked-btn" aria-label="我的收藏">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0112 6a5.5 5.5 0 019.5 6c-2.5 4.5-9.5 9-9.5 9z" fill="currentColor"/></svg>
            <span id="count-liked" class="liked-badge">0</span>
        </button>
    </header>

    <main class="stage">
        <div id="status" class="status">正在從部落格抓取迷因…</div>
        <div id="progress" class="progress" hidden></div>
        <div id="card-stack" class="card-stack" aria-live="polite"></div>

        <div class="actions">
            <button id="btn-pass" class="action-btn action-pass" aria-label="跳過">
                <svg viewBox="0 0 24 24" width="30" height="30"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></svg>
            </button>
            <button id="btn-undo" class="action-btn action-undo" aria-label="復原上一張">
                <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 14l-5-5 5-5M4 9h10a6 6 0 016 6v0a6 6 0 01-6 6h-3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            </button>
            <button id="btn-like" class="action-btn action-like" aria-label="喜歡">
                <svg viewBox="0 0 24 24" width="32" height="32"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0112 6a5.5 5.5 0 019.5 6c-2.5 4.5-9.5 9-9.5 9z" fill="currentColor"/></svg>
            </button>
        </div>

        <div class="hint">← 跳過 ・ → 喜歡 ・ ↑ 看原文 ・ z 復原</div>
    </main>

    <span id="count-passed" hidden>0</span>

    <!-- Liked gallery -->
    <div id="gallery" class="modal" hidden>
        <div class="modal-head">
            <h2 id="gallery-title">我喜歡的迷因</h2>
            <div class="modal-tools">
                <button id="btn-export" class="tool-btn">匯出 JSON</button>
                <button id="btn-clear" class="tool-btn danger">清空</button>
                <button id="btn-close-gallery" class="tool-btn">關閉</button>
            </div>
        </div>
        <div id="gallery-grid" class="gallery-grid"></div>
        <div id="gallery-empty" class="empty-state" hidden>還沒有任何收藏 — 在主畫面右滑或點 ❤️ 來收集你喜歡的迷因。</div>
    </div>

    <!-- Settings menu -->
    <div id="menu" class="modal small" hidden>
        <div class="modal-head">
            <h2>選單</h2>
            <button id="btn-close-menu" class="tool-btn">關閉</button>
        </div>
        <div class="menu-body">
            <button class="menu-item" id="menu-reset-passed">把「跳過」全部還原（再看一次）</button>
            <button class="menu-item danger" id="menu-reset-all">把所有紀錄都清掉</button>
            <hr>
            <p class="menu-info">
                資料來源：<a href="https://hornydragon.blogspot.com/?m=1" target="_blank" rel="noopener">hornydragon.blogspot.com</a><br>
                所有喜好都儲存在你的瀏覽器本機（localStorage），沒有上傳到任何地方。
            </p>
            <p class="menu-info" id="loaded-info"></p>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" hidden>
        <button class="lightbox-close" id="lightbox-close">×</button>
        <img id="lightbox-img" alt="">
        <a id="lightbox-link" target="_blank" rel="noopener" class="lightbox-link">查看原文 ↗</a>
    </div>

    <script src="app.js"></script>
</body>
</html>
